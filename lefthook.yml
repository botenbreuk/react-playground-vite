# yaml-language-server: $schema=https://lefthook.dev/schema.json

glob_matcher: doublestar
# # Loads nvm when git runs the hooks without it, see .lefthookrc. Keep the ./: sh looks a bare name up on PATH.
rc: ./.lefthookrc

pre-commit:
  commands:
    prettier:
      glob: '{src,test}/**/*.{js,jsx,json,scss,tsx,ts}'
      run: npx prettier --single-quote --write {staged_files}
      stage_fixed: true
    check-dependencies:
      run: npm run check-dependencies
